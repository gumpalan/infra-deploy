# Map untuk WebSocket Connection header upgrade yang benar.
# File ini harus di-include di level http {} nginx, bukan di dalam server {}.
# Sudah otomatis di-include oleh /etc/nginx/nginx.conf via conf.d/*.conf jika
# direktori conf.d berada di level http.
#
# Jika client kirim header Upgrade (WebSocket), forward sebagai "upgrade".
# Jika tidak (request HTTP biasa), gunakan "close" agar koneksi tidak menggantung.
map $http_upgrade $connection_upgrade {
    default   "upgrade";
    ""        "close";
}
