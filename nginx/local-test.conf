# nginx.conf lokal untuk test integrasi Gumpalan
# Dijalankan langsung oleh user (bukan systemd) dengan:
#   nginx -c /home/anomali99/Documents/Gumpalan/infra-deploy/nginx/local-test.conf
#
# Hentikan dengan:
#   nginx -c /home/anomali99/Documents/Gumpalan/infra-deploy/nginx/local-test.conf -s quit

worker_processes 1;

# Tulis PID dan log di folder yang bisa ditulis user biasa
pid /tmp/gumpalan-nginx.pid;
error_log /tmp/gumpalan-nginx-error.log warn;

events {
    worker_connections 64;
}

http {
    access_log /tmp/gumpalan-nginx-access.log;

    server {
        listen 8080;
        server_name _;

        # Titik verifikasi token — hanya bisa dipanggil internal (auth_request)
        location = /_verify {
            internal;
            proxy_pass http://127.0.0.1:8001/auth/v1/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # Rute svc-auth (publik — tidak pakai auth_request)
        location /auth/v1/ {
            proxy_pass http://127.0.0.1:8001/auth/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rute svc-iot (dilindungi auth_request)
        location /iot/v1/ {
            auth_request /_verify;

            # Teruskan Device-Id, User-Id, dan User-Role dari svc-auth ke svc-iot
            auth_request_set $device_id $upstream_http_x_device_id;
            proxy_set_header X-Device-Id $device_id;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_set_header X-User-Role $user_role;

            proxy_pass http://127.0.0.1:8002/iot/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check
        location /healthz {
            proxy_pass http://127.0.0.1:8001/healthz;
        }
    }
}
